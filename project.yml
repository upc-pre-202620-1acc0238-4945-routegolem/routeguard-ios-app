name: RouteGuard
options:
  bundleIdPrefix: pe.edu.upc.routeguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  RouteGuard:
    type: application
    platform: iOS
    sources:
      - path: RouteGuard
    settings:
      base:
        INFOPLIST_FILE: RouteGuard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: pe.edu.upc.routeguard.ios
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  RouteGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RouteGuardTests
    dependencies:
      - target: RouteGuard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: pe.edu.upc.routeguard.ios.tests
  RouteGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RouteGuardUITests
    dependencies:
      - target: RouteGuard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: pe.edu.upc.routeguard.ios.uitests
schemes:
  RouteGuard:
    build:
      targets:
        RouteGuard: all
        RouteGuardTests: [test]
        RouteGuardUITests: [test]
    test:
      targets:
        - RouteGuardTests
        - RouteGuardUITests
